name: Spell Check

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    spellcheck:
        name: Spell Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Run Spell Checker
              uses: streetsidesoftware/cspell-action@v6
              with:
                  config: '.cspell.json'
